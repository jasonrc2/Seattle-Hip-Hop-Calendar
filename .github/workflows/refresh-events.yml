name: Refresh Seattle Hip-Hop Events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: write

jobs:
  refresh-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Collect events
        run: |
          python scripts/collect_events.py

      - name: Commit updated events
        run: |
          git config user.name "Seattle Hip-Hop Calendar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/events.json

          if git diff --cached --quiet; then
            echo "No event changes detected."
          else
            git commit -m "Update Seattle hip-hop events"
            git push
          fi
